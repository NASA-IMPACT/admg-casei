name: Lint and Test

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NODE: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Use Node.js ${{ env.NODE }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE }}

      - name: Cache node modules
        uses: actions/cache@v5.0.5
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install
        run: yarn install

      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NODE: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Use Node.js ${{ env.NODE }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE }}

      - name: Cache node modules
        uses: actions/cache@v5.0.5
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install
        run: yarn install

      - name: Test
        run: yarn test
